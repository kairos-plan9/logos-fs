[package]
name = "logos-session-ns"
version = "0.1.0"
edition = "2024"

[dependencies]
logos-vfs = { path = "../logos-vfs" }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "fs", "io-util", "sync"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
