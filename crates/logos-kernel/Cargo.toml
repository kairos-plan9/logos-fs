[package]
name = "logos-kernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
chat = ["dep:logos-mm"]
sandbox = ["dep:containerd-client", "dep:prost-types", "dep:libc"]
full = ["chat", "sandbox"]

[dependencies]
logos-vfs = { path = "../logos-vfs" }
logos-mm = { path = "../logos-mm", optional = true }
logos-system = { path = "../logos-system" }
logos-session-ns = { path = "../logos-session-ns" }
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync"] }
tonic = { version = "0.14.5", features = ["transport"] }
tonic-prost = "0.14.2"
prost = "0.14.3"
tokio-stream = { version = "0.1", features = ["net"] }
serde_json = "1"
futures-util = "0.3"
chrono = "0.4"
cron = "0.15"
serde_yaml = "0.9"
dotenvy = "0.15"

serde = { version = "1", features = ["derive"] }
containerd-client = { version = "0.8.0", optional = true }
prost-types = { version = "0.13", optional = true }
libc = { version = "0.2.183", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
milvus-sdk-rust = "0.1"

[dev-dependencies]
tempfile = "3"
logos-session = { path = "../logos-session" }

[build-dependencies]
tonic-prost-build = "0.14.2"
prost-build = "0.14.3"
protoc-bin-vendored = "3"
